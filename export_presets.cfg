; Preset de exportação para Android.
;
; Depois de abrires o projeto no editor:
;   1. Editor > Manage Export Templates... -> instala os templates da versão 4.2+.
;   2. Editor > Editor Settings > Export > Android -> aponta para o Android SDK (e JDK 17).
;   3. Project > Export... -> escolhe o preset "Android", define o keystore de debug/release
;      na aba correspondente, e exporta.
;
; O nome do pacote, versão e definições de ecrã já vêm preenchidos a partir do project.godot.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/titan-royale.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
seed=0
script_export_mode=2

